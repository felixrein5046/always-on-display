name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk AlwaysOnDisplay.apk

      - name: Als Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysOnDisplay
          path: AlwaysOnDisplay.apk

      - name: Als Release veröffentlichen (direkter Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Always On Display – Build ${{ github.run_number }}
          files: AlwaysOnDisplay.apk
